<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Live Code Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closetag.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-html.js"></script>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#d9dee8;--text:#1c2230;--mute:#5d667a;--acc:#2563eb;--onacc:#fff;--btn:#eef1f6;--btnh:#e1e6ef;--bad:#c62828;--warn:#9a6700;color-scheme:light}
:root[data-theme=dark]{--bg:#12151c;--panel:#181c25;--line:#262b38;--text:#dfe4ee;--mute:#8b93a5;--acc:#7fb4ff;--onacc:#0b1220;--btn:#232938;--btnh:#2c3347;--bad:#ff7b72;--warn:#e3b341;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
button,select{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--btnh)}
button.primary{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header,.tools{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
header strong{font-weight:600;margin-right:6px}
label{display:flex;gap:6px;align-items:center;color:var(--mute);white-space:nowrap;cursor:pointer}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--split,50%)) 6px minmax(0,1fr);grid-template-rows:1fr 150px;grid-template-areas:"code dv prev" "code dv cons"}
#code{grid-area:code;min-height:0;display:flex;flex-direction:column}
#dv{grid-area:dv;background:var(--line);cursor:col-resize;touch-action:none}
#dv:hover{background:var(--acc)}
#prev{grid-area:prev;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
#cons{grid-area:cons;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.ftabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.ftabs button{border:0;border-radius:0;background:none;padding:9px 18px;color:var(--mute)}
.ftabs button.on{color:var(--text);box-shadow:inset 0 -2px var(--acc)}
#ed{flex:1;min-height:0;position:relative}
.CodeMirror{position:absolute;inset:0;height:auto;font:13px/1.55 'Roboto Mono',monospace}
#stage{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center}
#wrap{position:relative;width:100%;max-width:100%;height:100%;background:#fff}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
#ov{position:absolute;border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);cursor:move;touch-action:none;z-index:5}
#ov[hidden]{display:none}
#ov i{position:absolute;width:14px;height:14px;background:var(--acc);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);touch-action:none}
.chead{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;color:var(--mute);border-bottom:1px solid var(--line)}
.chead button{padding:2px 8px}
#log{flex:1;overflow:auto;padding:6px 12px;font:12px/1.5 'Roboto Mono',monospace}
#log div{padding:2px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
#log .error{color:var(--bad)}#log .warn{color:var(--warn)}
nav{display:none;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px}
nav button.on{color:var(--acc);box-shadow:inset 0 2px var(--acc)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;width:min(92vw,680px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 10px;font-size:15px;display:flex;gap:10px;align-items:center}
dialog textarea{width:100%;height:240px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px 'Roboto Mono',monospace}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
body.nohead header{display:none}
@media (max-width:899px){
  main{display:block}
  #code,#prev,#cons{height:100%;display:none}
  #dv{display:none}
  main[data-tab=code] #code{display:flex}
  main[data-tab=preview] #prev{display:flex}
  main[data-tab=console] #cons{display:flex}
  nav{display:flex}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <strong>Live Editor</strong>
  <button class="primary" id="run" title="Ctrl/Cmd+Enter">Run</button>
  <label><input type="checkbox" id="auto" checked> Auto-run</label>
  <button id="fmt">Format</button>
  <button id="copy">Copy</button>
  <button id="open">Open</button>
  <button id="save" title="Ctrl/Cmd+S">Save</button>
  <button id="clear">Clear</button>
  <select id="theme" aria-label="Theme"><option value="auto">Theme: Auto</option><option value="light">Theme: Light</option><option value="dark">Theme: Dark</option></select>
  <input type="file" id="file" accept=".html,.htm,.txt" hidden>
</header>

<main id="main" data-tab="code">
  <section id="code">
    <div class="ftabs"><button data-f="html" class="on">HTML</button><button data-f="css">CSS</button><button data-f="js">JS</button></div>
    <div id="ed"><textarea id="src"></textarea></div>
  </section>
  <div id="dv" role="separator" aria-label="Resize panes"></div>
  <section id="prev">
    <div class="tools">
      <select id="dev" aria-label="Preview width"><option value="100%">Full width</option><option value="768px">Tablet 768</option><option value="375px">Phone 375</option></select>
      <select id="mode" aria-label="Preview tool">
        <option value="off">Tool: Off</option><option value="text">Edit text</option><option value="inspect">Inspect (HTML / style)</option><option value="layout">Layout (move / resize)</option>
      </select>
    </div>
    <div id="stage"><div id="wrap">
      <iframe id="frame" title="Preview" sandbox="allow-scripts allow-same-origin allow-modals allow-forms allow-popups"></iframe>
      <div id="ov" hidden></div>
    </div></div>
  </section>
  <section id="cons">
    <div class="chead"><span>Console</span><button id="clr">Clear</button></div>
    <div id="log" role="log"></div>
  </section>
</main>

<nav>
  <button data-tab="code" class="on">Code</button>
  <button data-tab="preview">Preview</button>
  <button data-tab="console" id="ctab">Console</button>
</nav>

<dialog id="dlg">
  <h3>Edit element <select id="dlgKind"><option value="html">HTML</option><option value="style">Inline style</option><option value="page">Page CSS</option></select><span id="dlgTag"></span></h3>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="row"><button id="dlgCancel">Cancel</button><button class="primary" id="dlgSave">Apply</button></div>
</dialog>
<div id="toast" role="status"></div>
