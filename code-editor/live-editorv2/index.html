<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Live Code Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closetag.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-html.js"></script>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#d9dee8;--text:#1c2230;--mute:#5d667a;--acc:#2563eb;--onacc:#fff;--btn:#eef1f6;--btnh:#e1e6ef;--bad:#c62828;--warn:#9a6700;color-scheme:light}
:root[data-theme=dark]{--bg:#12151c;--panel:#181c25;--line:#262b38;--text:#dfe4ee;--mute:#8b93a5;--acc:#7fb4ff;--onacc:#0b1220;--btn:#232938;--btnh:#2c3347;--bad:#ff7b72;--warn:#e3b341;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
button,select{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--btnh)}
button.primary{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header,.tools{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
header strong{font-weight:600;margin-right:6px}
label{display:flex;gap:6px;align-items:center;color:var(--mute);white-space:nowrap;cursor:pointer}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--split,50%)) 6px minmax(0,1fr);grid-template-rows:1fr 150px;grid-template-areas:"code dv prev" "code dv cons"}
#code{grid-area:code;min-height:0;display:flex;flex-direction:column}
#dv{grid-area:dv;background:var(--line);cursor:col-resize;touch-action:none}
#dv:hover{background:var(--acc)}
#prev{grid-area:prev;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
#cons{grid-area:cons;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.ftabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.ftabs button{border:0;border-radius:0;background:none;padding:9px 18px;color:var(--mute)}
.ftabs button.on{color:var(--text);box-shadow:inset 0 -2px var(--acc)}
#ed{flex:1;min-height:0;position:relative}
.CodeMirror{position:absolute;inset:0;height:auto;font:13px/1.55 'Roboto Mono',monospace}
#stage{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center}
#wrap{position:relative;width:100%;max-width:100%;height:100%;background:#fff}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
#ov{position:absolute;border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);cursor:move;touch-action:none;z-index:5}
#ov[hidden]{display:none}
#ov i{position:absolute;width:14px;height:14px;background:var(--acc);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);touch-action:none}
.chead{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;color:var(--mute);border-bottom:1px solid var(--line)}
.chead button{padding:2px 8px}
#log{flex:1;overflow:auto;padding:6px 12px;font:12px/1.5 'Roboto Mono',monospace}
#log div{padding:2px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
#log .error{color:var(--bad)}#log .warn{color:var(--warn)}
nav{display:none;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px}
nav button.on{color:var(--acc);box-shadow:inset 0 2px var(--acc)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;width:min(92vw,680px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 10px;font-size:15px;display:flex;gap:10px;align-items:center}
dialog textarea{width:100%;height:240px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px 'Roboto Mono',monospace}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
body.nohead header{display:none}
@media (max-width:899px){
  main{display:block}
  #code,#prev,#cons{height:100%;display:none}
  #dv{display:none}
  main[data-tab=code] #code{display:flex}
  main[data-tab=preview] #prev{display:flex}
  main[data-tab=console] #cons{display:flex}
  nav{display:flex}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <strong>Live Editor</strong>
  <button class="primary" id="run" title="Ctrl/Cmd+Enter">Run</button>
  <label><input type="checkbox" id="auto" checked> Auto-run</label>
  <button id="fmt">Format</button>
  <button id="copy">Copy</button>
  <button id="open">Open</button>
  <button id="save" title="Ctrl/Cmd+S">Save</button>
  <button id="clear">Clear</button>
  <select id="theme" aria-label="Theme"><option value="auto">Theme: Auto</option><option value="light">Theme: Light</option><option value="dark">Theme: Dark</option></select>
  <input type="file" id="file" accept=".html,.htm,.txt" hidden>
</header>

<main id="main" data-tab="code">
  <section id="code">
    <div class="ftabs"><button data-f="html" class="on">HTML</button><button data-f="css">CSS</button><button data-f="js">JS</button></div>
    <div id="ed"><textarea id="src"></textarea></div>
  </section>
  <div id="dv" role="separator" aria-label="Resize panes"></div>
  <section id="prev">
    <div class="tools">
      <select id="dev" aria-label="Preview width"><option value="100%">Full width</option><option value="768px">Tablet 768</option><option value="375px">Phone 375</option></select>
      <select id="mode" aria-label="Preview tool">
        <option value="off">Tool: Off</option><option value="text">Edit text</option><option value="inspect">Inspect (HTML / style)</option><option value="layout">Layout (move / resize)</option>
      </select>
    </div>
    <div id="stage"><div id="wrap">
      <iframe id="frame" title="Preview" sandbox="allow-scripts allow-same-origin allow-modals allow-forms allow-popups"></iframe>
      <div id="ov" hidden></div>
    </div></div>
  </section>
  <section id="cons">
    <div class="chead"><span>Console</span><button id="clr">Clear</button></div>
    <div id="log" role="log"></div>
  </section>
</main>

<nav>
  <button data-tab="code" class="on">Code</button>
  <button data-tab="preview">Preview</button>
  <button data-tab="console" id="ctab">Console</button>
</nav>

<dialog id="dlg">
  <h3>Edit element <select id="dlgKind"><option value="html">HTML</option><option value="style">Inline style</option><option value="page">Page CSS</option></select><span id="dlgTag"></span></h3>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="row"><button id="dlgCancel">Cancel</button><button class="primary" id="dlgSave">Apply</button></div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const toast = (m, ms=1800) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms); };

/* ---------- Files & editor ---------- */
const STARTER = {
  html: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
</head>
<body>
  <h1>Hello, editor</h1>
  <p>Edit the HTML, CSS and JS tabs. The preview updates as you type.</p>
  <button id="btn">Log a message</button>
</body>
</html>`,
  css: `body { font-family: system-ui, sans-serif; margin: 24px; color: #222; }
h1 { color: #1a6dff; }
button { padding: 8px 14px; border: 0; border-radius: 6px; background: #1a6dff; color: #fff; }`,
  js: `document.getElementById('btn').addEventListener('click', () => {
  console.log('Clicked at', new Date().toLocaleTimeString());
});`
};
const MODES = { html: 'htmlmixed', css: 'css', js: 'javascript' };
let saved = null;
try { saved = JSON.parse(store.get('le:v2')); } catch(e){}
if (!saved) { const old = store.get('le:code'); saved = old ? { html: old, css: '', js: '' } : STARTER; }

const docs = {}; Object.keys(MODES).forEach(k => docs[k] = CodeMirror.Doc(saved[k] || '', MODES[k]));
const cm = CodeMirror.fromTextArea($('#src'), {
  lineNumbers: true, lineWrapping: true, autoCloseTags: true, autoCloseBrackets: true, matchBrackets: true,
  tabSize: 2, indentUnit: 2, indentWithTabs: false,
  extraKeys: {
    Tab: c => tryEmmet(c) || (c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('  ')),
    'Shift-Tab': c => c.indentSelection('subtract'),
    'Ctrl-Enter': () => run(), 'Cmd-Enter': () => run(),
    'Ctrl-S': () => save(), 'Cmd-S': () => save()
  }
});
let cur = 'html'; cm.swapDoc(docs.html);
document.querySelectorAll('.ftabs button').forEach(b => b.onclick = () => {
  cur = b.dataset.f; cm.swapDoc(docs[cur]); cm.focus();
  document.querySelectorAll('.ftabs button').forEach(x => x.classList.toggle('on', x === b));
});

/* ---------- Rendering ---------- */
const frame = $('#frame');
const BRIDGE = '<script data-le>(function(){var s=function(t,a){try{parent.postMessage({__le:1,t:t,m:Array.prototype.map.call(a,function(x){try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}};["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){s(k,arguments);o.apply(console,arguments)}});addEventListener("error",function(e){s("error",[e.message+" (line "+e.lineno+")"])});addEventListener("unhandledrejection",function(e){s("error",["Unhandled promise rejection: "+e.reason])})})()<\/script>';
let syncing = false;

function compose(preview, p){
  p = p || { html: docs.html.getValue(), css: docs.css.getValue(), js: docs.js.getValue() };
  const a = preview ? ' data-le' : '', css = p.css, js = p.js;
  const style = css.trim() ? '<style' + a + '>' + css + '</style>' : '';
  const tail = js.trim() ? '<script' + a + '>' + js.replace(/<\/script/gi, '<\\/script') + '<\/script>' : '';
  const OPEN = /<head(\s[^>]*)?>/i;
  let h = p.html;
  if (preview) h = OPEN.test(h) ? h.replace(OPEN, m => m + BRIDGE) : BRIDGE + h;
  if (style) h = /<\/head>/i.test(h) ? h.replace(/<\/head>/i, () => style + '</head>') : OPEN.test(h) ? h.replace(OPEN, m => m + style) : style + h;
  return /<\/body>/i.test(h) ? h.replace(/<\/body>/i, () => tail + '</body>') : h + tail;
}
function run(){ clearLog(); hideSel(); frame.srcdoc = compose(true); if (mobile.matches) setTab('preview'); }
const autoRun = debounce(() => { if ($('#auto').checked && !syncing) { clearLog(); hideSel(); frame.srcdoc = compose(true); } }, 450);
const persist = debounce(() => store.set('le:v2', JSON.stringify({ html: docs.html.getValue(), css: docs.css.getValue(), js: docs.js.getValue() })), 400);
Object.values(docs).forEach(d => d.on('change', () => { persist(); autoRun(); }));

/* ---------- Preview tools: edit text / inspect / layout ---------- */
const ov = $('#ov'); let sel = null;
const P = { nw:[0,0], n:[50,0], ne:[100,0], e:[100,50], se:[100,100], s:[50,100], sw:[0,100], w:[0,50] };
Object.entries(P).forEach(([d,[x,y]]) => { const i = document.createElement('i'); i.dataset.dir = d; i.style.left = x + '%'; i.style.top = y + '%'; i.style.cursor = d + '-resize'; ov.appendChild(i); });

function placeSel(){
  if (!sel || !sel.isConnected) { ov.hidden = true; return; }
  const r = sel.getBoundingClientRect();
  Object.assign(ov.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  ov.hidden = false;
}
function hideSel(){ sel = null; ov.hidden = true; }
function select(el){ const d = el.ownerDocument; if (el === d.body || el === d.documentElement) return hideSel(); sel = el; placeSel(); }

let drag = null;
ov.addEventListener('pointerdown', e => {
  if (!sel) return;
  const cs = frame.contentWindow.getComputedStyle(sel);
  if (cs.position === 'static') sel.style.position = 'relative';
  drag = { dir: e.target.dataset.dir || 'move', x: e.clientX, y: e.clientY, w: parseFloat(cs.width), h: parseFloat(cs.height), l: parseFloat(cs.left) || 0, t: parseFloat(cs.top) || 0 };
  ov.setPointerCapture(e.pointerId); e.preventDefault();
});
ov.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, s = sel.style, D = drag.dir, M = 20;
  if (D === 'move') { s.left = drag.l + dx + 'px'; s.top = drag.t + dy + 'px'; }
  else {
    if (D.includes('e')) s.width = Math.max(M, drag.w + dx) + 'px';
    if (D.includes('s')) s.height = Math.max(M, drag.h + dy) + 'px';
    if (D.includes('w')) { const w = Math.max(M, drag.w - dx); s.width = w + 'px'; s.left = drag.l + (drag.w - w) + 'px'; }
    if (D.includes('n')) { const h = Math.max(M, drag.h - dy); s.height = h + 'px'; s.top = drag.t + (drag.h - h) + 'px'; }
  }
  placeSel();
});
ov.addEventListener('pointerup', () => { if (drag) { drag = null; pull(); } });

function applyMode(){
  const d = frame.contentDocument; if (!d || !d.body) return;
  const m = $('#mode').value;
  m === 'text' ? d.body.setAttribute('contenteditable', 'true') : d.body.removeAttribute('contenteditable');
  if (m !== 'layout') hideSel();
}
$('#mode').onchange = applyMode;

frame.addEventListener('load', () => {
  const d = frame.contentDocument; if (!d || !d.body) return;
  applyMode();
  d.body.addEventListener('input', pull);
  d.addEventListener('scroll', placeSel, true);
  d.addEventListener('click', e => {
    const m = $('#mode').value; if (m !== 'inspect' && m !== 'layout') return;
    e.preventDefault(); e.stopPropagation();
    m === 'inspect' ? inspect(e.target) : select(e.target);
  }, true);
});
window.addEventListener('resize', () => { cm.refresh(); placeSel(); });

// Write the preview's current DOM back into the HTML tab.
const pull = debounce(() => {
  const d = frame.contentDocument; if (!d || !d.documentElement) return;
  const c = d.documentElement.cloneNode(true);
  c.querySelectorAll('[data-le]').forEach(n => n.remove());
  const b = c.querySelector('body'); if (b) b.removeAttribute('contenteditable');
  syncing = true; docs.html.setValue('<!DOCTYPE html>\n' + c.outerHTML); syncing = false;
}, 300);

let target = null; // null = empty area, edits Page CSS only
function fill(){
  const k = $('#dlgKind').value;
  $('#dlgText').value = k === 'page' ? docs.css.getValue() : !target ? '' : k === 'html' ? target.outerHTML : (target.getAttribute('style') || '');
}
function inspect(el){
  const d = el.ownerDocument, empty = el === d.documentElement || el === d.body;
  target = empty ? null : el;
  [...$('#dlgKind').options].forEach(o => o.hidden = empty && o.value !== 'page');
  $('#dlgKind').value = empty ? 'page' : 'html';
  $('#dlgTag').textContent = empty ? '(page)' : '<' + el.tagName.toLowerCase() + '>' + (el.id ? '#' + el.id : '');
  fill(); $('#dlg').showModal();
}
$('#dlgKind').onchange = fill;
$('#dlgCancel').onclick = () => $('#dlg').close();
$('#dlgSave').onclick = () => {
  try {
    const v = $('#dlgText').value, k = $('#dlgKind').value;
    if (k === 'page') { docs.css.setValue(v); run(); }
    else { k === 'html' ? (target.outerHTML = v) : (v.trim() ? target.setAttribute('style', v) : target.removeAttribute('style')); pull(); }
    toast('Applied');
  } catch(e){ toast('Could not apply: ' + e.message, 3000); }
  $('#dlg').close();
};

/* ---------- Console ---------- */
const log = $('#log'); let errCount = 0;
function clearLog(){ log.textContent = ''; errCount = 0; $('#ctab').textContent = 'Console'; }
window.addEventListener('message', e => {
  if (e.source !== frame.contentWindow || !e.data || !e.data.__le) return;
  const row = document.createElement('div'); row.className = e.data.t; row.textContent = e.data.m;
  log.appendChild(row); log.scrollTop = log.scrollHeight;
  if (e.data.t === 'error') $('#ctab').textContent = 'Console (' + (++errCount) + ')';
});
$('#clr').onclick = clearLog;

/* ---------- Toolbar ---------- */
$('#run').onclick = run;
$('#dev').onchange = e => { $('#wrap').style.width = e.target.value; placeSel(); };
$('#fmt').onclick = () => {
  const fn = { html: window.html_beautify, css: window.css_beautify, js: window.js_beautify }[cur];
  if (typeof fn !== 'function') return toast('Formatter failed to load');
  docs[cur].setValue(fn(docs[cur].getValue(), { indent_size: 2, preserve_newlines: true, max_preserve_newlines: 2 }));
  toast('Formatted ' + cur.toUpperCase());
};
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText(exportHtml()); toast('Full page copied'); }
  catch(e){ toast('Copy blocked by the browser', 3000); }
};
$('#clear').onclick = () => {
  if (!confirm('Clear all HTML, CSS and JS?')) return;
  Object.values(docs).forEach(d => d.setValue('')); handle = null; toast('Cleared');
};

let handle = null;
async function save(){
  const text = exportHtml();
  try {
    if (window.showSaveFilePicker) {
      handle = handle || await showSaveFilePicker({ suggestedName: 'page.html', types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }] });
      const w = await handle.createWritable(); await w.write(text); await w.close();
      return toast('Saved page.html (CSS and JS bundled in)');
    }
  } catch(e){ if (e.name === 'AbortError') return; handle = null; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/html' })); a.download = 'page.html'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Downloaded page.html');
}
$('#save').onclick = save;
// Split a full page into html (no inline <style>/<script>), css and js.
function split(src){
  const d = new DOMParser().parseFromString(src, 'text/html');
  const take = ns => ns.map(n => { const t = n.textContent.trim(); n.remove(); return t; }).filter(Boolean).join('\n\n');
  const css = take([...d.querySelectorAll('style')]);
  const js = take([...d.querySelectorAll('script')].filter(n => !n.hasAttribute('src') && (!n.type || /^(text|application)\/javascript$/i.test(n.type))));
  let html = '<!DOCTYPE html>\n' + d.documentElement.outerHTML;
  if (typeof html_beautify === 'function') html = html_beautify(html, { indent_size: 2, preserve_newlines: true, max_preserve_newlines: 2 });
  return { html, css, js };
}
// Formatting and comment removal
const FN = { html: 'html_beautify', css: 'css_beautify', js: 'js_beautify' };
const fmtPart = (k, v) => {
  const f = window[FN[k]];
  return typeof f === 'function' && v.trim() ? f(v, { indent_size: 2, preserve_newlines: true, max_preserve_newlines: 2 }) : v;
};
function stripCss(s){
  let o = '', i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === '"' || c === "'") { let j = i + 1; while (j < s.length && s[j] !== c) { if (s[j] === '\\') j++; j++; } o += s.slice(i, j + 1); i = j + 1; }
    else if (c === '/' && s[i + 1] === '*') { const j = s.indexOf('*/', i + 2); i = j < 0 ? s.length : j + 2; }
    else { o += c; i++; }
  }
  return o;
}
function stripJs(s){
  let o = '', i = 0;
  while (i < s.length) {
    const c = s[i], n = s[i + 1];
    if (c === '"' || c === "'") { let j = i + 1; while (j < s.length && s[j] !== c) { if (s[j] === '\\') j++; j++; } o += s.slice(i, j + 1); i = j + 1; }
    else if (c === '`') {
      let j = i + 1, d = 0;
      while (j < s.length && (s[j] !== '`' || d)) { if (s[j] === '\\') j++; else if (s[j] === '$' && s[j + 1] === '{') { d++; j++; } else if (s[j] === '}' && d) d--; j++; }
      o += s.slice(i, j + 1); i = j + 1;
    }

const STRIP = { html: v => v.replace(/<!--(?!\[if)[\s\S]*?-->/g, ''), css: stripCss, js: stripJs };

}
// Format the final combined page (so injected <style>/<script> are indented too) and tidy blank lines
function finalHtml(h){

function formatEditor(){

}
// Emmet-style abbreviations: in the HTML tab type e.g. div.box>ul>li*3 or ! and press Tab
const EM_TAGS = /^(div|p|ul|ol|li|img|h[1-6]|span|button|input|form|table|section|header|footer|nav|main|article|label)$/;
const EM_VOID = /^(img|br|hr|input|meta|link)$/;
const EM_DOC = ['<!DOCTYPE html>', '<html lang="en">', '<head>', '  <meta charset="UTF-8">', '  <meta name="viewport" content="width=device-width, initial-scale=1">', '  <title>Document</title>', '</head>', '<body>', '  ', '</body>', '</html>'].join('\n');
function emParse(str, texts){
  const gt = str.indexOf('>');
  const sibs = (gt < 0 ? str : str.slice(0, gt)).split('+');
  const kids = gt < 0 ? null : emParse(str.slice(gt + 1), texts);
  if (gt >= 0 && !kids) return null;

  for (let i = 0; i < sibs.length; i++) {
    const m = sibs[i].match(/^([a-z][\w-]*)?((?:[#.][\w$-]+)*)(\{\d+\})?(?:\*(\d+))?(\{\d+\})?$/i);
    if (!m || (!m[1] && !m[2] && !m[3] && !m[5])) return null;
    const tb = m[3] || m[5], idc = [...m[2].matchAll(/([#.])([\w$-]+)/g)];
    out.push({ tag: m[1] || 'div', id: (idc.find(x => x[1] === '#') || [])[2], cls: idc.filter(x => x[1] === '.').map(x => x[2]), text: tb ? texts[+tb.slice(1, -1)] : '', n: m[4] ? Math.min(+m[4], 50) : 1, kids: i === sibs.length - 1 ? kids : null });

}
function emRender(nodes, ind){

      let at = '';
      if (n.id) at += ' id="' + sub(n.id) + '"';
      if (n.cls.length) at += ' class="' + n.cls.map(sub).join(' ') + '"';
      if (n.tag === 'a') at += ' href=""';
      if (n.tag === 'img') at += ' src="" alt=""';
      const o = '<' + n.tag + at + '>';
      if (EM_VOID.test(n.tag)) parts.push(ind + o);
      else if (n.kids) parts.push(ind + o + '\n' + emRender(n.kids, ind + '  ') + '\n' + ind + '</' + n.tag + '>');

function tryEmmet(c){
